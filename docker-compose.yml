services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: cloudway-rag-api

    ports:
      - "8000:8000"

    env_file:
      - .env

    environment:
      HF_HOME: /root/.cache/huggingface

    volumes:
      - ./vector_db:/app/vector_db
      - ./knowledge_base:/app/knowledge_base:ro
      - hf_cache:/root/.cache/huggingface

    restart: unless-stopped

volumes:
  hf_cache:
